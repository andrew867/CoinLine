services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coinline
      POSTGRES_PASSWORD: coinline
      POSTGRES_DB: coinline
    # Reachable as hostname `postgres:5432` from other services. Not published on the host.
    healthcheck:
      # TCP, not the local socket: the entrypoint's bootstrap server is socket-only and
      # restarts once before it listens on 5432. A socket check goes healthy in that window.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U coinline -d coinline"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The lab still requires a validated operator token. The prod overlay sets Production.
      ASPNETCORE_ENVIRONMENT: Development
      # Explicit container-network binding for the web reverse proxy; host publication is loopback below.
      ASPNETCORE_URLS: http://0.0.0.0:5006
      COINLINE_OPERATOR_TOKEN_KEY: ${COINLINE_OPERATOR_TOKEN_KEY:-}
      COINLINE_DEV_OPERATOR_PASSWORD: ${COINLINE_DEV_OPERATOR_PASSWORD:-}
      COINLINE_BOOTSTRAP_ADMIN_USERNAME: ${COINLINE_BOOTSTRAP_ADMIN_USERNAME:-}
      COINLINE_BOOTSTRAP_ADMIN_PASSWORD: ${COINLINE_BOOTSTRAP_ADMIN_PASSWORD:-}
      # NCC TCP listener. Leave it enabled; do not set COINLINE_NCC_LISTEN=0.
      COINLINE_NCC_PORT: "4000"
      Ncc__BindAddress: 0.0.0.0
      Ncc__MaxConcurrentConnections: ${COINLINE_NCC_MAX_CONNECTIONS:-32}
      Ncc__ReadTimeoutSeconds: ${COINLINE_NCC_READ_TIMEOUT_SECONDS:-60}
      Ncc__IdleTimeoutSeconds: ${COINLINE_NCC_IDLE_TIMEOUT_SECONDS:-120}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=coinline;Username=coinline;Password=coinline
      Platform__PayloadStorage__RootPath: /var/coinline/payloads
      CardPayments__SimulationMode: "false"
      CardPayments__PhysicalCardWritesDisabled: "true"
      # SIP registrar credentials come from sip.env (gitignored). See sip.env.example.
      SipModem__Enabled: "true"
      # Container-network bind is explicit; host SIP and RTP publication remain loopback by default.
      SipModem__BindAddress: 0.0.0.0
      SipModem__LoopbackHost: "host.docker.internal"
      SipModem__NccHost: "127.0.0.1"
      SipModem__NccPort: "4000"
    env_file:
      - path: sip.env
        required: false
    ports:
      - "${COINLINE_API_BIND_ADDRESS:-127.0.0.1}:5006:5006"
      - "${COINLINE_NCC_BIND_ADDRESS:-127.0.0.1}:4000:4000"
      - "${COINLINE_SIP_BIND_ADDRESS:-127.0.0.1}:5060:5060/udp"
      - "${COINLINE_SIP_BIND_ADDRESS:-127.0.0.1}:40000-40007:40000-40007/udp"
    volumes:
      - ./data/payloads:/var/coinline/payloads

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${COINLINE_WEB_BIND_ADDRESS:-127.0.0.1}:8080:80"

  # Heartbeat row only. Session handling stays on the API listener.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=coinline;Username=coinline;Password=coinline
