; Standalone private lab example. Replace documentation IP addresses.
; If reusing an existing UDP transport, omit this transport section
; and change the transport names below to the existing transport.
[coinline-audiogram-udp]
type=transport
protocol=udp
bind=192.0.2.30:5060

; Static analog gateway authenticating its calls to Asterisk.
[coinline-lab-gateway]
type=endpoint
transport=coinline-audiogram-udp
context=coinline-audiogram-lab
disallow=all
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
allow_transfer=no
auth=coinline-lab-gateway-auth
aors=coinline-lab-gateway
identify_by=ip

[coinline-lab-gateway-auth]
type=auth
auth_type=userpass
username=coinline-lab-gateway
password=REPLACE_WITH_UNIQUE_LAB_SECRET

[coinline-lab-gateway]
type=aor
contact=sip:192.0.2.10:5060

[coinline-lab-gateway-identify]
type=identify
endpoint=coinline-lab-gateway
match=192.0.2.10/32

; Adapter contact: this must be a real compatible Audio-Gram service.
; Keep extension 7003 disabled until the service is configured.
[audiogram-adapter]
type=endpoint
transport=coinline-audiogram-udp
context=coinline-audiogram-adapter
disallow=all
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
allow_transfer=no
aors=audiogram-adapter
; Configure outbound_auth separately if the adapter requires digest.

[audiogram-adapter]
type=aor
contact=sip:7003@192.0.2.20:5060
