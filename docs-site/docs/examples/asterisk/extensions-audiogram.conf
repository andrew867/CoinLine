; Include in a dedicated Asterisk lab. No public routes are included.
[coinline-audiogram-lab]
exten => 7001,1,Ringing()
 same => n,Wait(45)
 same => n,Hangup(19)

exten => 7002,1,Busy(15)
 same => n,Hangup(17)

; Default: reject until an actual compatible service is available.
exten => 7003,1,Hangup(21)

; When a compatible, authorized service is ready, replace the active
; 7003 line above with these two lines (remove their comment markers).
; exten => 7003,1,Dial(PJSIP/audiogram-adapter,30)
;  same => n,Hangup()

; No outgoing routes are granted to the service adapter.
[coinline-audiogram-adapter]
exten => s,1,Hangup(21)

; Optional local recording test. Do not include this context from the gateway
; or a public context. Only grant it to an explicitly trusted lab endpoint.
; This does not emulate the terminal's protected Audio-Gram handshake.
[coinline-audiogram-record-test]
exten => 7004,1,Set(AGISIGHUP=no)
 same => n,AGI(coinline_audiogram_agi.py,/etc/coinline/audiogram.json,record,lab-recipient)
 same => n,Hangup()

; Call-file delivery accepts only an explicitly defined local recipient.
[coinline-audiogram-recipients]
exten => 7005,1,Dial(PJSIP/audiogram-lab-recipient,30)
 same => n,Hangup()

; Entered by a locally created Asterisk call file after the recipient answers.
[coinline-audiogram-playback]
exten => s,1,Set(AGISIGHUP=no)
 same => n,AGI(coinline_audiogram_agi.py,/etc/coinline/audiogram.json,deliver,${COINLINE_AUDIOGRAM_MESSAGE_ID})
 same => n,Hangup()
