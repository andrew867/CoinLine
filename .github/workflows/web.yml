name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Vitest and browser workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
        env:
          CI: "true"

      - name: Unit tests (vitest)
        run: npm run test:unit
        env:
          CI: "true"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify console workflow fixtures
        run: npm run e2e -- e2e/failed-download.spec.ts e2e/quick-access-customers.spec.ts e2e/advertising-editor.spec.ts e2e/native-spare-fields.spec.ts e2e/call-setup-spares.spec.ts e2e/rating-coin-spares.spec.ts e2e/graphical-spare-fields.spec.ts e2e/carrier-scheduler-spares.spec.ts e2e/card-terminal-routing.spec.ts e2e/numbering-profile.spec.ts e2e/per-phone-access-rollout.spec.ts
        env:
          CI: "true"

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-console-workflows
          path: web/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7
