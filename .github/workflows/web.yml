name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Vitest and browser workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
        env:
          CI: "true"

      - name: Unit tests (vitest)
        run: npm run test:unit
        env:
          CI: "true"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify phone profile compatibility preflight
        run: npm run e2e -- e2e/phone-profile-preflight.spec.ts --output test-results/phone-profile-preflight
        env:
          CI: "true"

      - name: Verify interface timing worksheet workflow
        run: npm run e2e -- e2e/interface-timing.spec.ts --output test-results/interface-timing
        env:
          CI: "true"

      - name: Verify console workflow fixtures
        run: npm run e2e -- e2e/failed-download.spec.ts e2e/quick-access-customers.spec.ts e2e/advertising-editor.spec.ts e2e/native-spare-fields.spec.ts e2e/call-setup-spares.spec.ts e2e/rating-coin-spares.spec.ts e2e/graphical-spare-fields.spec.ts e2e/carrier-scheduler-spares.spec.ts e2e/card-terminal-routing.spec.ts e2e/numbering-profile.spec.ts e2e/per-phone-access-rollout.spec.ts e2e/display-feature-preservation.spec.ts
        env:
          CI: "true"

      - name: Verify graphical link review workflow
        run: npm run e2e -- e2e/graphical-link-review.spec.ts --output test-results/graphical-link-review
        env:
          CI: "true"

      - name: Verify terminal ID cutover review workflow
        run: npm run e2e -- e2e/terminal-id-cutover.spec.ts --output test-results/terminal-id-cutover
        env:
          CI: "true"

      - name: Verify firmware profile revision workflow
        run: npm run e2e -- e2e/firmware-profile-revision.spec.ts --output test-results/firmware-profile-revision
        env:
          CI: "true"

      - name: Verify visual prompt worksheet workflow
        run: npm run e2e -- e2e/visual-prompt-worksheet.spec.ts --output test-results/visual-prompts
        env:
          CI: "true"

      - name: Verify card authorization history workflow
        run: npm run e2e -- e2e/card-authorization-history.spec.ts --output test-results/card-authorization-history
        env:
          CI: "true"

      - name: Verify communications performance histogram workflow
        run: npm run e2e -- e2e/performance-buckets.spec.ts --output test-results/performance-buckets
        env:
          CI: "true"

      - name: Verify restricted route review workflow
        run: npm run e2e -- e2e/restriction-route-review.spec.ts --output test-results/restriction-route-review
        env:
          CI: "true"

      - name: Verify discount calendar workflow
        run: npm run e2e -- e2e/discount-calendar.spec.ts --output test-results/discount-calendar
        env:
          CI: "true"

      - name: Verify reference record catalogue workflow
        run: npm run e2e -- e2e/reference-record-catalogue.spec.ts --output test-results/reference-record-catalogue
        env:
          CI: "true"

      - name: Verify observed firmware profiles workflow
        run: npm run e2e -- e2e/observed-firmware-profiles.spec.ts --output test-results/observed-firmware-profiles
        env:
          CI: "true"

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-console-workflows
          path: web/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7
