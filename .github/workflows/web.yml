name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Vitest and browser workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
        env:
          CI: "true"

      - name: Unit tests (vitest)
        run: npm run test:unit
        env:
          CI: "true"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify phone profile compatibility preflight
        run: npm run e2e -- e2e/phone-profile-preflight.spec.ts --output test-results/phone-profile-preflight
        env:
          CI: "true"

      - name: Verify interface timing worksheet workflow
        run: npm run e2e -- e2e/interface-timing.spec.ts --output test-results/interface-timing
        env:
          CI: "true"

      - name: Verify expired operator session returns to login
        run: npm run e2e -- e2e/session-expiry.spec.ts --output test-results/session-expiry
        env:
          CI: "true"

      - name: Verify console workflow fixtures
        run: npm run e2e -- e2e/failed-download.spec.ts e2e/quick-access-customers.spec.ts e2e/advertising-editor.spec.ts e2e/native-spare-fields.spec.ts e2e/call-setup-spares.spec.ts e2e/rating-coin-spares.spec.ts e2e/graphical-spare-fields.spec.ts e2e/carrier-scheduler-spares.spec.ts e2e/card-terminal-routing.spec.ts e2e/numbering-profile.spec.ts e2e/per-phone-access-rollout.spec.ts e2e/display-feature-preservation.spec.ts e2e/download-preparation.spec.ts
      - name: Verify portable terminal configuration package workflow
        run: npm run e2e -- e2e/portable-terminal-configuration.spec.ts --output test-results/portable-terminal-configuration
        env:
          CI: "true"
      - name: Verify phone registration group membership workflow
        run: npm run e2e -- e2e/phone-registration-groups.spec.ts
        env:
          CI: "true"

      - name: Verify graphical link review workflow
        run: npm run e2e -- e2e/graphical-link-review.spec.ts --output test-results/graphical-link-review
        env:
          CI: "true"

      - name: Verify terminal ID cutover review workflow
        run: npm run e2e -- e2e/terminal-id-cutover.spec.ts --output test-results/terminal-id-cutover
        env:
          CI: "true"

      - name: Verify individual phone configuration worksheet
        run: npm run e2e -- e2e/phone-configuration-worksheet.spec.ts --output test-results/phone-configuration-worksheet
        env:
          CI: "true"

      - name: Verify routine call-in randomization workflow
        run: npm run e2e -- e2e/routine-call-in-randomization.spec.ts --output test-results/routine-call-in-randomization
        env:
          CI: "true"

      - name: Verify firmware profile revision workflow
        run: npm run e2e -- e2e/firmware-profile-revision.spec.ts --output test-results/firmware-profile-revision
        env:
          CI: "true"

      - name: Verify firmware screening transition workflow
        run: npm run e2e -- e2e/firmware-screening-transition.spec.ts --output test-results/firmware-screening-transition
        env:
          CI: "true"

      - name: Verify visual prompt worksheet workflow
        run: npm run e2e -- e2e/visual-prompt-worksheet.spec.ts --output test-results/visual-prompts
        env:
          CI: "true"

      - name: Verify firmware tariff transition workflow
        run: npm run e2e -- e2e/firmware-tariff-transition.spec.ts --output test-results/firmware-tariff-transition
        env:
          CI: "true"

      - name: Verify firmware visual prompt transition workflow
        run: npm run e2e -- e2e/firmware-visual-prompt-transition.spec.ts --output test-results/firmware-prompt-transition
        env:
          CI: "true"

      - name: Verify card authorization history workflow
        run: npm run e2e -- e2e/card-authorization-history.spec.ts --output test-results/card-authorization-history
        env:
          CI: "true"

      - name: Verify rate plan package workflow
        run: npm run e2e -- e2e/rate-plan-package.spec.ts --output test-results/rate-plan-package
        env:
          CI: "true"

      - name: Verify communications performance histogram workflow
        run: npm run e2e -- e2e/performance-buckets.spec.ts --output test-results/performance-buckets
        env:
          CI: "true"

      - name: Verify cashbox query workflow
        run: npm run e2e -- e2e/cashbox-query.spec.ts --output test-results/cashbox-query
        env:
          CI: "true"

      - name: Verify host rate plan selection workflow
        run: npm run e2e -- e2e/host-rate-plan-selection.spec.ts --output test-results/host-rate-plan-selection
        env:
          CI: "true"

      - name: Verify CDR upload observation workflow
        run: npm run e2e -- e2e/cdr-upload-observation.spec.ts --output test-results/cdr-upload-observation
        env:
          CI: "true"

      - name: Verify firmware local dialing transition workflow
        run: npm run e2e -- e2e/firmware-local-dialing-transition.spec.ts --output test-results/firmware-local-dialing-transition
        env:
          CI: "true"

      - name: Verify restricted route review workflow
        run: npm run e2e -- e2e/restriction-route-review.spec.ts --output test-results/restriction-route-review
        env:
          CI: "true"

      - name: Verify common firmware controls transition workflow
        run: npm run e2e -- e2e/firmware-common-control-transition.spec.ts --output test-results/firmware-common-control-transition
        env:
          CI: "true"

      - name: Verify cross-configuration screening workflow
        run: npm run e2e -- e2e/screening-bulk.spec.ts --output test-results/screening-bulk
        env:
          CI: "true"

      - name: Verify discount calendar workflow
        run: npm run e2e -- e2e/discount-calendar.spec.ts --output test-results/discount-calendar
        env:
          CI: "true"

      - name: Verify reference record catalogue workflow
        run: npm run e2e -- e2e/reference-record-catalogue.spec.ts --output test-results/reference-record-catalogue
        env:
          CI: "true"

      - name: Verify observed firmware profiles workflow
        run: npm run e2e -- e2e/observed-firmware-profiles.spec.ts --output test-results/observed-firmware-profiles
        env:
          CI: "true"

      - name: Verify configuration library workflow
        run: npm run e2e -- e2e/configuration-library.spec.ts --output test-results/configuration-library
        env:
          CI: "true"

      - name: Verify firmware artifact and job preparation workflow
        run: npm run e2e -- e2e/firmware-artifact-upload.spec.ts --output test-results/firmware-artifact-upload
        env:
          CI: "true"

      - name: Verify current reported phone status workflow
        run: npm run e2e -- e2e/current-phone-status.spec.ts --output test-results/current-phone-status
        env:
          CI: "true"

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-console-workflows
          path: web/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7
